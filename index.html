<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misión Red Planet I - Inventario de Tripulación</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="main.css">
  <script defer src="/Inventario_De_Tripulacion/src/main.js"></script>
</head>
<body>
  <main class="container">
    <h1>🚀 Misión Red Planet I: Panel de Control</h1>
    
    <!-- Formulario para agregar astronauta -->
    <section class="card">
      <h2>Añadir Astronauta</h2>
      <form id="formAstronauta">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" required placeholder="Ej: Sarah">
        </div>

        <div class="form-group">
          <label for="rol">Rol:</label>
          <select id="rol" required>
            <option value="">Selecciona un rol</option>
            <option value="Piloto">Piloto</option>
            <option value="Ingeniero">Ingeniero</option>
            <option value="Médica">Médica</option>
            <option value="Científico">Científico</option>
          </select>
        </div>

        <div class="form-group">
          <label for="experiencia">Experiencia (años):</label>
          <input type="number" id="experiencia" min="0" required placeholder="Ej: 4">
        </div>

        <button type="submit">Agregar Astronauta</button>
      </form>
      <p id="msgConfirmacion" class="msg"></p>
    </section>

    <!-- Panel de Control y Acciones -->
    <section class="card">
      <h2>Acciones del Comandante</h2>
      <div class="button-group">
        <button id="btnListar">Listar tripulación</button>
        <button id="btnFiltrar">Mostrar pilotos</button>
        <button id="btnMedia">Calcular experiencia media</button>
      </div>

      <div class="output-box">
        <h3>Resultado:</h3>
        <p id="salida">Selecciona una acción arriba...</p>
      </div>
    </section>
  </main>

  
</body>
</html>
